name: Validate encrypted data
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Validate containers, hashes and current access references
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFile, readdir } from 'node:fs/promises';
          import { createHash } from 'node:crypto';
          import { execFileSync } from 'node:child_process';
          const tracked=execFileSync('git',['ls-files','-z'],{encoding:'utf8'}).split('\0').filter(Boolean);
          for (const path of tracked) assert.ok(path==='.gitkeep'||path==='manifest.json'||path==='.github/workflows/validate.yml'||/^objects\/[a-f0-9]{64}\.bin$/.test(path),'Unexpected public file: '+path);
          const raw=await readFile('manifest.json','utf8'), manifest=JSON.parse(raw);
          assert.equal(manifest.schema,'frchat-manifest/2');
          assert.match(manifest.key_epoch,/^[a-f0-9]{32}$/);
          const checkKdf=kdf=>{assert.equal(kdf.name,'PBKDF2');assert.equal(kdf.hash,'SHA-256');assert.ok(kdf.iterations>=600000);assert.ok(Buffer.from(kdf.salt,'base64').length>=16);};
          checkKdf(manifest.kdf);
          assert.ok(Array.isArray(manifest.accounts)&&manifest.accounts.length>0);
          assert.equal(new Set(manifest.accounts.map(a=>a.id)).size,manifest.accounts.length);
          assert.ok(!/(?:github_pat_|ghp_)[A-Za-z0-9_]{20,}/.test(raw));
          const headers=new Map(), ivs=new Set();
          for (const file of await readdir('objects',{withFileTypes:true})) {
            assert.ok(file.isFile()&&/^[a-f0-9]{64}\.bin$/.test(file.name));
            const bytes=await readFile('objects/'+file.name);
            assert.equal(createHash('sha256').update(bytes).digest('hex'),file.name.slice(0,-4));
            assert.equal(bytes.subarray(0,4).toString(),'FRC1');
            const size=bytes.readUInt32BE(4);assert.ok(size>0&&size<=16384&&bytes.length>=8+size+16);
            const header=JSON.parse(bytes.subarray(8,8+size).toString());
            assert.equal(header.schema,'frchat-object/1');assert.match(header.epoch,/^[a-f0-9]{32}$/);
            assert.equal(Buffer.from(header.iv,'base64').length,12);
            const iv=header.epoch+':'+header.iv;assert.ok(!ivs.has(iv),'Repeated IV');ivs.add(iv);
            headers.set('objects/'+file.name,header);
          }
          const checkRef=(ref,id)=>{assert.match(ref.sha256,/^[a-f0-9]{64}$/);assert.equal(ref.path,'objects/'+ref.sha256+'.bin');assert.equal(ref.object_id,id);const header=headers.get(ref.path);assert.ok(header,'Missing current object');assert.equal(header.epoch,manifest.key_epoch);assert.equal(header.objectId,id);};
          checkRef(manifest.index,'index');
          for (const account of manifest.accounts) {assert.match(account.id,/^[a-z0-9-]{1,40}$/);checkKdf(account.kdf);checkRef(account.credential,'access:'+account.id);}
          console.log('Encrypted containers, hashes and '+manifest.accounts.length+' current access references verified; no private keys needed.');
          NODE
